<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 45 Practice Quiz 2</title>

    <style>
        /* --- CSS Variables & Themes --- */
        :root {
            --transition-speed: 0.3s;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            
            /* Default Feedback Colors (Fallback for custom themes) */
            --feedback-success-bg: #064e3b;
            --feedback-success-border: #059669;
            --feedback-success-text: #a7f3d0;
            --feedback-error-bg: #7f1d1d;
            --feedback-error-border: #dc2626;
            --feedback-error-text: #fecaca;
        }

        [data-theme="dark"] {
            --bg-body: #1e293b; --bg-card: #334155; --bg-header: #0f172a;
            --text-main: #f1f5f9; --text-muted: #94a3b8; --text-accent: #38bdf8;
            --border-color: #475569; --highlight-bg: #475569;
            --button-bg: #38bdf8; --button-text: #0f172a; --button-hover: #0ea5e9;
        }

        [data-theme="light"] {
            --bg-body: #f3f4f6; --bg-card: #ffffff; --bg-header: #ffffff;
            --text-main: #1f2937; --text-muted: #6b7280; --text-accent: #2563eb;
            --border-color: #e5e7eb; --highlight-bg: #f3f4f6;
            --button-bg: #2563eb; --button-text: #ffffff; --button-hover: #1d4ed8;
            --feedback-success-bg: #ecfdf5; --feedback-success-border: #34d399; --feedback-success-text: #065f46;
            --feedback-error-bg: #fef2f2; --feedback-error-border: #f87171; --feedback-error-text: #991b1b;
        }

        [data-theme="midnight"] {
            --bg-body: #000000; --bg-card: #000000; --bg-header: #000000;
            --text-main: #e0e0e0; --text-muted: #888888; --text-accent: #90caf9;
            --border-color: #333333; --highlight-bg: #1a1a1a;
            --button-bg: #90caf9; --button-text: #000000; --button-hover: #42a5f5;
            --feedback-success-bg: #051b11; --feedback-success-border: #0f5132; --feedback-success-text: #75b798;
            --feedback-error-bg: #2c0b0e; --feedback-error-border: #842029; --feedback-error-text: #ea868f;
        }

        [data-theme="legacy-dark"] {
            --bg-body: #2d343e; --bg-card: #3c424f; --bg-header: #3c424f;
            --text-main: #e8e6e3; --text-muted: #b0c4de; --text-accent: #8ab4f8;
            --border-color: #555; --highlight-bg: #454c5a;
            --button-bg: #8ab4f8; --button-text: #202124; --button-hover: #a3c5f9;
            --feedback-success-bg: #344e41; --feedback-success-border: #52b788; --feedback-success-text: #c7f9cc;
            --feedback-error-bg: #5e2129; --feedback-error-border: #a4133c; --feedback-error-text: #f8d7da;
        }

        [data-theme="sepia"] {
            --bg-body: #f4ecd8; --bg-card: #fdf6e3; --bg-header: #e4d5b7;
            --text-main: #433422; --text-muted: #7c6f5a; --text-accent: #a05a2c;
            --border-color: #d3c4a5; --highlight-bg: #ebe1c9;
            --button-bg: #a05a2c; --button-text: #fdf6e3; --button-hover: #864822;
            --feedback-success-bg: #e6f4ea; --feedback-success-border: #8ab893; --feedback-success-text: #2e4c35;
            --feedback-error-bg: #f9e3e3; --feedback-error-border: #d48f8f; --feedback-error-text: #5c2b2b;
        }

        [data-theme="contrast"] {
            --bg-body: #000000; --bg-card: #000000; --bg-header: #000000;
            --text-main: #ffffff; --text-muted: #dddddd; --text-accent: #ffff00;
            --border-color: #ffffff; --highlight-bg: #333333;
            --button-bg: #ffff00; --button-text: #000000; --button-hover: #e6e600;
            --feedback-success-bg: #000000; --feedback-success-border: #00ff00; --feedback-success-text: #00ff00;
            --feedback-error-bg: #000000; --feedback-error-border: #ff0000; --feedback-error-text: #ff0000;
        }

        /* --- Global Reset & Layout --- */
        * { box-sizing: border-box; }
        
        body {
            font-family: var(--font-main);
            margin: 0;
            background-color: var(--bg-body);
            color: var(--text-main);
            transition: background-color var(--transition-speed), color var(--transition-speed);
            line-height: 1.6;
        }

        /* --- Header --- */
        header {
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        header.unpinned { position: relative; box-shadow: none; }

        .header-top {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; flex-wrap: wrap; gap: 15px;
        }

        header h1 { font-size: 1.5rem; margin: 0; color: var(--text-accent); font-weight: 700; }

        .controls-wrapper { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

        /* --- Custom Theme Builder --- */
        .custom-builder {
            display: none; flex-wrap: wrap; gap: 15px;
            background-color: var(--bg-card); padding: 10px 15px;
            border-radius: 8px; border: 1px solid var(--border-color);
            margin-top: 5px; font-size: 0.85rem; animation: fadeIn 0.3s;
            width: 100%; justify-content: flex-end;
        }
        .custom-builder.active { display: flex; }
        .color-picker-group { display: flex; align-items: center; gap: 8px; }
        .color-picker-group input[type="color"] {
            border: none; width: 25px; height: 25px; border-radius: 4px;
            cursor: pointer; padding: 0; background: none;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Controls --- */
        .header-btn {
            background-color: var(--highlight-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-btn:hover {
            border-color: var(--text-accent);
            color: var(--text-accent);
        }

        .pin-btn {
            background: none; border: 1px solid var(--border-color); color: var(--text-main);
            cursor: pointer; padding: 0 10px; border-radius: 6px; font-size: 1rem;
            transition: background-color 0.2s; height: 34px; display: flex;
            align-items: center; justify-content: center;
        }
        .pin-btn:hover { background-color: var(--highlight-bg); }
        .pin-btn.pin-active { background-color: rgba(0, 0, 0, 0.1); }

        select#theme-select {
            padding: 0 12px; border-radius: 6px; border: 1px solid var(--border-color);
            background-color: var(--bg-card); color: var(--text-main);
            cursor: pointer; font-family: inherit; height: 34px;
        }

        /* --- Section Navigation --- */
        .section-nav { display: flex; gap: 10px; flex-wrap: wrap; }
        .section-nav button {
            background-color: var(--highlight-bg); color: var(--text-main);
            border: 1px solid var(--border-color); padding: 6px 12px;
            border-radius: 6px; cursor: pointer; font-size: 0.85rem;
            font-weight: 500; transition: all 0.2s;
        }
        .section-nav button:hover { border-color: var(--text-accent); color: var(--text-accent); }

        /* --- Main Content --- */
        .container {
            max-width: 850px;
            margin: 2rem auto;
            padding: 0 1rem 4rem 1rem;
        }

        .section-header {
            margin-top: 3rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--text-accent);
            color: var(--text-accent);
            font-size: 1.5rem;
            font-weight: 700;
            scroll-margin-top: 150px; /* Offset for sticky header */
        }

        /* --- Question Card --- */
        .question-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
        }

        .lo-box {
            background-color: var(--highlight-bg);
            border-left: 4px solid var(--text-accent);
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 4px;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-style: italic;
            display: none; /* Hidden by default */
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        /* --- Options --- */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-label:hover {
            background-color: var(--highlight-bg);
            border-color: var(--text-muted);
        }

        .option-label input {
            margin-top: 0.3rem;
            margin-right: 1rem;
            accent-color: var(--text-accent);
            transform: scale(1.2);
        }

        /* --- Buttons --- */
        .btn-check {
            margin-top: 1.5rem;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            font-size: 1rem;
        }

        .btn-check:hover {
            opacity: 0.9;
        }

        .btn-link {
            display: inline-block;
            background-color: var(--button-bg);
            color: var(--button-text);
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            transition: opacity 0.2s;
            font-size: 1rem;
        }

        .btn-link:hover {
            opacity: 0.9;
        }

        /* --- Feedback Area --- */
        .feedback {
            margin-top: 1.5rem;
            padding: 1.5rem;
            border-radius: 8px;
            display: none; /* Hidden by default */
            border: 1px solid transparent;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback.correct {
            background-color: var(--feedback-success-bg);
            border-color: var(--feedback-success-border);
            color: var(--feedback-success-text);
        }

        .feedback.incorrect {
            background-color: var(--feedback-error-bg);
            border-color: var(--feedback-error-border);
            color: var(--feedback-error-text);
        }

        .feedback-header {
            font-weight: 800;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .rationale {
            margin-top: 1rem;
            font-size: 0.95rem;
        }

        .source {
            display: block;
            margin-top: 1rem;
            font-size: 0.85rem;
            opacity: 0.8;
            font-style: italic;
            border-top: 1px dashed currentColor;
            padding-top: 0.5rem;
        }

        /* --- Mobile Tweaks --- */
        @media (max-width: 768px) {
            .header-top { flex-direction: column; align-items: flex-start; }
            .controls-wrapper { width: 100%; justify-content: flex-start; }
            .section-nav { justify-content: flex-start; }
            .custom-builder { justify-content: flex-start; }
            header h1 { font-size: 1.25rem; }
            #reveal-all-container { justify-content: flex-start !important; }
        }
    </style>
</head>
<body>

    <header id="main-header">
        <div class="header-top">
            <h1>Week 45 Practice Quiz 2</h1>
            <div class="controls-wrapper">
                
                <!-- Reveal LOs Button -->
                <button id="reveal-all-btn" class="header-btn" onclick="toggleAllLOs()">Show Learning Objectives</button>
                
                <!-- Pin Button -->
                <button class="pin-btn pin-active" id="pin-btn" onclick="toggleHeader()" title="Pin/Unpin Header">📌</button>
                
                <!-- Theme Selector -->
                <div class="theme-control">
                    <select id="theme-select" onchange="changeTheme(this.value)">
                        <option value="dark">Modern Dark</option>
                        <option value="midnight">Midnight</option>
                        <option value="light">Modern Light</option>
                        <option value="legacy-dark">Legacy Dark</option>
                        <option value="sepia">Sepia</option>
                        <option value="contrast">High Contrast</option>
                        <option value="custom">⚙️ Custom...</option>
                    </select>
                </div>
            </div>
            
            <!-- Custom Theme Color Pickers -->
            <div class="custom-builder" id="custom-builder">
                <div class="color-picker-group">
                    <label>Background:</label>
                    <input type="color" id="color-bg" value="#1a1a2e" oninput="updateCustomTheme()">
                </div>
                <div class="color-picker-group">
                    <label>Cards:</label>
                    <input type="color" id="color-card" value="#16213e" oninput="updateCustomTheme()">
                </div>
                <div class="color-picker-group">
                    <label>Text:</label>
                    <input type="color" id="color-text" value="#e94560" oninput="updateCustomTheme()">
                </div>
                <div class="color-picker-group">
                    <label>Accent:</label>
                    <input type="color" id="color-accent" value="#0f3460" oninput="updateCustomTheme()">
                </div>
            </div>
        </div>
        
        <!-- Dynamic Navigation Bar -->
        <div class="section-nav" id="section-nav"></div>
    </header>

    <div class="container">
        <div id="quiz-root">
            <!-- Content injected via JS -->
        </div>
    </div>

    <script>
        // --- Data ---
        const quizData = [
            // --- Section 1: Diabetes-Induced Dysregulation of Lipid Metabolism ---
            {
                section: "Diabetes-Induced Dysregulation of Lipid Metabolism",
                fullLO: "LO1: Understand insulin regulation of metabolism.",
                question: "A 45-year-old healthy man eats a carbohydrate-rich meal, triggering a spike in endogenous insulin secretion. At the cellular level, insulin binds to its receptor and triggers a signaling cascade involving Akt. This cascade leads to the phosphorylation and subsequent inhibition of the FOXO1 transcription factor in the liver. Which of the following metabolic processes is directly suppressed as a result of FOXO1 inhibition?",
                options: {
                    A: "Glycogen synthesis",
                    B: "Gluconeogenesis",
                    C: "Glycolysis",
                    D: "Lipogenesis",
                    E: "Proteolysis"
                },
                correctAnswer: "B",
                rationale: "In the liver, insulin signaling via Akt phosphorylates and inhibits the FOXO1 transcription factor. FOXO1 normally promotes the expression of gluconeogenic genes (like G6Pase and PEPCK). By inhibiting FOXO1, insulin shuts down gluconeogenesis.",
                source: "Diabetes-Induced Dysregulation of Lipid Metabolism PDF, slide 10: 'Regulation of glucose metabolism by insulin... Akt [inhibits] FOXO1 [inhibits] Gluconeogenesis genes (G6Pase, PEPCK, etc) [decreases] Gluconeogenesis'"
            },
            {
                section: "Diabetes-Induced Dysregulation of Lipid Metabolism",
                fullLO: "LO1: Understand insulin regulation of metabolism.",
                question: "A 22-year-old woman with type 1 diabetes administers her prandial dose of insulin. As insulin acts on her adipose tissue, it promotes lipogenesis and strictly inhibits lipolysis. The inhibition of lipolysis in her adipocytes is mediated by the insulin-stimulated activation of which of the following specific intracellular enzymes?",
                options: {
                    A: "Hormone-sensitive lipase (HSL)",
                    B: "Phosphodiesterase 3B (PDE3B)",
                    C: "Protein kinase A (PKA)",
                    D: "Sterol regulatory element-binding protein 1c (SREBP1c)",
                    E: "cAMP-dependent protein kinase"
                },
                correctAnswer: "B",
                rationale: "In adipocytes, insulin signaling activates Akt, which subsequently activates PDE3B. PDE3B degrades cAMP, leading to the inhibition of Protein Kinase A (PKA) and the subsequent inhibition of Hormone-sensitive lipase (HSL), thereby halting lipolysis.",
                source: "Diabetes-Induced Dysregulation of Lipid Metabolism PDF, slide 18: 'Regulation of lipid metabolism by insulin... Akt [activates] PDE3B [inhibits] PKA [decreases]... HSL [decreases]... [decreases] Lipolysis'"
            },
            {
                section: "Diabetes-Induced Dysregulation of Lipid Metabolism",
                fullLO: "LO2: Understand the relationship between leptin, obesity and insulin resistance to the development of diabetic complications.",
                question: "A medical researcher is studying the endocrine function of adipose tissue in obese patients. She notes that as body fat mass increases, adipocytes secrete proportionally larger amounts of a 16-kDa protein hormone designed to regulate food intake. Upon reaching the hypothalamus, this hormone normally binds to the LepRb receptor. This binding primarily regulates gene expression via which of the following intracellular signaling pathways?",
                options: {
                    A: "cAMP/Protein Kinase A",
                    B: "JAK-STAT",
                    C: "MAP kinase",
                    D: "PI3K/Akt",
                    E: "Wnt/beta-catenin"
                },
                correctAnswer: "B",
                rationale: "Leptin is secreted by adipocytes and acts on the hypothalamus. It binds to its receptor (LepRb) and activates the JAK-STAT pathway to regulate the expression of genes involved in food intake and energy expenditure.",
                source: "Diabetes-Induced Dysregulation of Lipid Metabolism PDF, slide 28: 'Leptin signaling and functions... Leptin binds to its receptor LepRb and activates JAK-STAT pathway to regulate gene expression'"
            },
            {
                section: "Diabetes-Induced Dysregulation of Lipid Metabolism",
                fullLO: "LO2: Understand the relationship between leptin, obesity and insulin resistance to the development of diabetic complications.",
                question: "A 55-year-old obese man is diagnosed with type 2 diabetes mellitus. His physician explains that his excess adipose tissue is actively driving his disease through \"lipotoxicity.\" In this pathophysiological mechanism, which of the following specific lipid metabolites is primarily responsible for preventing insulin from working properly in his muscle and fat cells?",
                options: {
                    A: "Bile acids",
                    B: "Chylomicron remnants",
                    C: "Free fatty acids (FFAs)",
                    D: "High-density lipoproteins (HDL)",
                    E: "Ketone bodies"
                },
                correctAnswer: "C",
                rationale: "In obesity-driven type 2 diabetes, insulin resistance is heavily driven by lipotoxicity. Elevated free fatty acids (FFAs) interfere with insulin signaling, preventing it from working properly in muscle and fat cells. Increased FFA transport to the liver also contributes to hepatic insulin resistance.",
                source: "Diabetes-Induced Dysregulation of Lipid Metabolism PDF, slide 26: 'Mechanisms Driving T2DM via Dyslipidemia: • Insulin resistance (Lipotoxicity): Elevated free fatty acids (FFAs) prevent insulin from working properly in muscle and fat cells.'"
            },
            {
                section: "Diabetes-Induced Dysregulation of Lipid Metabolism",
                fullLO: "LO3: Understand how ketone body synthesis is impacted in diabetics and clinical complications of this altered regulation.",
                question: "A 19-year-old man with undiagnosed type 1 diabetes is brought to the emergency department in a coma. His breath has a fruity odor, and laboratory results reveal profound metabolic acidosis. Because he lacks insulin, massive amounts of fatty acids undergo beta-oxidation to form excess acetyl-CoA. In which of the following cellular locations is this excess acetyl-CoA converted into ketone bodies?",
                options: {
                    A: "Adipocyte cytosol",
                    B: "Liver mitochondria",
                    C: "Pancreatic beta-cell cytosol",
                    D: "Skeletal muscle mitochondria",
                    E: "Renal tubular cell cytoplasm"
                },
                correctAnswer: "B",
                rationale: "Ketogenesis occurs primarily when fatty acids are broken down into acetyl-CoA, which is then converted into ketone bodies specifically within the mitochondria of liver cells.",
                source: "Diabetes-Induced Dysregulation of Lipid Metabolism PDF, slide 34: 'Ketogenesis: ... Fatty acids are broken down into acetyl-CoA through beta-oxidation, and then Acetyl-CoA is converted into ketone bodies in liver mitochondria.'"
            },
            {
                section: "Diabetes-Induced Dysregulation of Lipid Metabolism",
                fullLO: "LO3: Understand how ketone body synthesis is impacted in diabetics and clinical complications of this altered regulation.",
                question: "A 70-year-old obese man with type 2 diabetes develops severe dehydration and a blood glucose level of 800 mg/dL. Despite his profound hyperglycemia, his serum tests completely negative for ketones. Which of the following physiological principles best explains the absence of ketosis in this patient's Hyperosmolar Hyperglycemic State (HHS)?",
                options: {
                    A: "Adipose tissue is highly sensitive to insulin, requiring very little to inhibit lipolysis.",
                    B: "Hepatic gluconeogenesis effectively consumes all available free fatty acids.",
                    C: "His kidneys rapidly excrete all synthesized ketones into the urine.",
                    D: "Muscle cells require extremely low amounts of insulin to force glucose out of the blood.",
                    E: "Pancreatic alpha-cells completely cease the production of glucagon."
                },
                correctAnswer: "A",
                rationale: "The \"Insulin Sensitivity Gap\" explains why HHS patients do not develop ketosis. Adipose tissue is highly sensitive to insulin (the Anti-Lipolytic Threshold is low); it takes only about 10% as much insulin to completely inhibit lipolysis as it does to stimulate glucose uptake. In HHS, the small amount of residual insulin is enough to shut down lipolysis (preventing FFA release and ketogenesis) but not enough to clear glucose.",
                source: "Diabetes-Induced Dysregulation of Lipid Metabolism PDF, slide 38: 'The Insulin Sensitivity Gap... Anti-Lipolytic Threshold (Low): Adipose (fat) tissue is highly sensitive to insulin. It takes only about 10% as much insulin to completely inhibit lipolysis as it does to stimulate glucose uptake and utilization.'"
            },

            // --- Section 2: Pathology of Diabetes ---
            {
                section: "Pathology of Diabetes",
                fullLO: "LO1: Define diabetes mellitus and list the basic diagnostic criteria.",
                question: "A 50-year-old man visits his primary care physician for a routine physical examination. He has no complaints and reports no polyuria, polydipsia, or weight loss. A comprehensive metabolic panel is drawn after he has fasted for 10 hours. According to the World Health Organization (WHO) and American Diabetes Association (ADA) criteria, which of the following fasting blood glucose levels (in mg/dL) represents the minimum threshold for a definitive diagnosis of diabetes mellitus?",
                options: {
                    A: "100",
                    B: "110",
                    C: "126",
                    D: "140",
                    E: "200"
                },
                correctAnswer: "C",
                rationale: "According to the WHO and ADA criteria, a fasting blood glucose level of 126 mg/dL or greater is diagnostic for diabetes. Levels between 100 and 125 mg/dL indicate Impaired Glucose Tolerance (IGT) or prediabetes.",
                source: "Pathology of Diabetes PDF, slide 9 & 10: 'Diabetes Mellitus WHO Criteria... Fasting [Graph shows Diabetes starting at] 126'"
            },
            {
                section: "Pathology of Diabetes",
                fullLO: "LO1: Define diabetes mellitus and list the basic diagnostic criteria.",
                question: "A 45-year-old overweight woman is being screened for diabetes mellitus. Her physician orders an Oral Glucose Tolerance Test (OGTT). After consuming the standard glucose load, her blood glucose is measured at the 2-hour mark. Which of the following values (in mg/dL) is the lowest threshold at this 2-hour mark that confirms a diagnosis of diabetes?",
                options: {
                    A: "126",
                    B: "140",
                    C: "155",
                    D: "180",
                    E: "200"
                },
                correctAnswer: "E",
                rationale: "On an Oral Glucose Tolerance Test (OGTT) evaluated at the 2-hour mark, a blood glucose level of 200 mg/dL or greater is diagnostic of diabetes. Levels between 140 and 199 mg/dL represent Impaired Glucose Tolerance (IGT).",
                source: "Pathology of Diabetes PDF, slide 9 & 10: 'Diabetes Mellitus WHO Criteria... OGTT @ 2 hr [Graph shows Diabetes starting at] 200'"
            },
            {
                section: "Pathology of Diabetes",
                fullLO: "LO2: Compare and contrast Type 1 and Type 2 diabetes mellitus in regard to: Pathogenesis, Genetic predisposition and risk factors, Typical clinical presentation, Morphologic features.",
                question: "A 12-year-old boy presents to the clinic with significant weight loss, excessive thirst, and frequent urination. Laboratory testing confirms the diagnosis of type 1 diabetes mellitus. The fundamental pathogenesis of his condition involves the active destruction of his pancreatic beta-cells. Which of the following cell types are the major culprits directly mediating this cellular destruction?",
                options: {
                    A: "B lymphocytes and plasma cells",
                    B: "CD4+ T cells (TH1 subset) and CD8+ cytotoxic T cells",
                    C: "Eosinophils and mast cells",
                    D: "Macrophages and multinucleated giant cells",
                    E: "Neutrophils and natural killer cells"
                },
                correctAnswer: "B",
                rationale: "Type 1 diabetes is characterized by the autoimmune destruction of beta-cells. The major culprits in this pathogenesis are T lymphocytes, specifically CD4+ T cells of the TH1 subset and CD8+ cytotoxic T cells.",
                source: "Pathology of Diabetes PDF, slide 23: 'Type 1 Diabetes Mellitus Pathogenesis • Autoimmune destruction of β-cells • T lymphocytes major culprits – CD4+ T cells of the TH1 subset – CD8+ cytotoxic T cells'"
            },
            {

        // --- Core Logic ---
        const quizRoot = document.getElementById('quiz-root');
        const themeSelect = document.getElementById('theme-select');
        const pinBtn = document.getElementById('pin-btn');
        const mainHeader = document.getElementById('main-header');
        const sectionNav = document.getElementById('section-nav');
        const customBuilder = document.getElementById('custom-builder');
        const rootElements = document.documentElement;

        let isRevealed = false;

        function toggleAllLOs() {
            isRevealed = !isRevealed;
            const btn = document.getElementById('reveal-all-btn');
            btn.textContent = isRevealed ? "Hide Learning Objectives" : "Show Learning Objectives";
            
            document.querySelectorAll('.lo-box').forEach(box => {
                box.style.display = isRevealed ? 'block' : 'none';
            });
        }

        function initQuiz() {
            let currentSection = "";
            let sectionIndex = 0;
            
            quizData.forEach((item, index) => {
                if (item.section !== currentSection) {
                    currentSection = item.section;
                    
                    const sectionId = 'sec-' + sectionIndex;
                    
                    const sectionHeader = document.createElement('h2');
                    sectionHeader.className = 'section-header';
                    sectionHeader.id = sectionId;
                    sectionHeader.textContent = currentSection;
                    quizRoot.appendChild(sectionHeader);

                    const navBtn = document.createElement('button');
                    let btnText = currentSection;
                    if (btnText.includes("Diabetes-Induced Dysregulation of Lipid Metabolism")) btnText = "Lipid Metabolism";
                    if (btnText.includes("Pathology of Diabetes")) btnText = "Pathology of Diabetes";
                    if (btnText.includes("Infections in the Diabetic Patient")) btnText = "Infections in Diabetics";
                    if (btnText.includes("Insulin and Oral Hypoglycemics: Clinical Applications")) btnText = "Insulin & Hypoglycemics";
                    
                    navBtn.textContent = btnText;
                    navBtn.onclick = () => {
                        document.getElementById(sectionId).scrollIntoView({ behavior: 'smooth' });
                    };
                    sectionNav.appendChild(navBtn);

                    sectionIndex++;
                }

                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-card-${index}`;

                const loBox = document.createElement('div');
                loBox.className = 'lo-box';
                loBox.id = `lo-${index}`;
                loBox.innerHTML = item.fullLO;
                card.appendChild(loBox);

                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerHTML = `${index + 1}. ${item.question}`;
                card.appendChild(qText);

                const optionsGrid = document.createElement('div');
                optionsGrid.className = 'options-grid';

                for (const[key, value] of Object.entries(item.options)) {
                    const label = document.createElement('label');
                    label.className = 'option-label';
                    
                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = `question-${index}`;
                    input.value = key;

                    const span = document.createElement('span');
                    span.innerHTML = `${key}. ${value}`;

                    label.appendChild(input);
                    label.appendChild(span);
                    optionsGrid.appendChild(label);
                }
                card.appendChild(optionsGrid);

                const btn = document.createElement('button');
                btn.className = 'btn-check';
                btn.textContent = 'Check Answer';
                btn.onclick = () => checkAnswer(index);
                card.appendChild(btn);

                const feedback = document.createElement('div');
                feedback.className = 'feedback';
                feedback.id = `feedback-${index}`;
                card.appendChild(feedback);

                quizRoot.appendChild(card);
            });

            const returnContainer = document.createElement('div');
            returnContainer.style.textAlign = 'center';
            returnContainer.style.marginTop = '2rem';
            
            const returnBtn = document.createElement('a');
            returnBtn.href = 'https://ibecerramcg.github.io/GI-GU-ENDO-Practice-Quizzes/';
            returnBtn.className = 'btn-link';
            returnBtn.textContent = '← Return to Quiz Directory';
            
            returnContainer.appendChild(returnBtn);
            quizRoot.appendChild(returnContainer);

            const savedTheme = localStorage.getItem('quizTheme') || 'dark';
            themeSelect.value = savedTheme;
            changeTheme(savedTheme);

            const savedPinState = localStorage.getItem('headerPinned');
            toggleHeader(savedPinState !== 'false');
        }

        function checkAnswer(index) {
            const selected = document.querySelector(`input[name="question-${index}"]:checked`);
            const feedbackEl = document.getElementById(`feedback-${index}`);
            const data = quizData[index];

            if (!selected) {
                alert("Please select an answer.");
                return;
            }

            const isCorrect = selected.value === data.correctAnswer;
            
            let html = `<span class="feedback-header">${isCorrect ? "Correct!" : "Incorrect"}</span>`;
            if (!isCorrect) {
                html += `<div>The correct answer is <strong>${data.correctAnswer}</strong>.</div>`;
            }
            
            html += `<div class="rationale"><strong>Rationale:</strong> ${data.rationale}</div>`;
            html += `<div class="source"><strong>Source:</strong> ${data.source}</div>`;

            feedbackEl.innerHTML = html;
            feedbackEl.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;
            feedbackEl.style.display = 'block';
        }

        function changeTheme(themeName) {
            localStorage.setItem('quizTheme', themeName);
            
            if (themeName === 'custom') {
                rootElements.removeAttribute('data-theme');
                customBuilder.classList.add('active');
                loadCustomTheme();
            } else {
                rootElements.setAttribute('data-theme', themeName);
                customBuilder.classList.remove('active');
                rootElements.removeAttribute('style');
            }
        }

        function updateCustomTheme() {
            const bg = document.getElementById('color-bg').value;
            const card = document.getElementById('color-card').value;
            const text = document.getElementById('color-text').value;
            const accent = document.getElementById('color-accent').value;

            rootElements.style.setProperty('--bg-body', bg);
            rootElements.style.setProperty('--bg-header', bg);
            rootElements.style.setProperty('--bg-card', card);
            rootElements.style.setProperty('--highlight-bg', card);
            rootElements.style.setProperty('--text-main', text);
            rootElements.style.setProperty('--text-accent', accent);
            rootElements.style.setProperty('--button-bg', accent);
            rootElements.style.setProperty('--button-text', bg);
            rootElements.style.setProperty('--border-color', accent + '40');

            const customColors = { bg, card, text, accent };
            localStorage.setItem('customThemeColors', JSON.stringify(customColors));
        }

        function loadCustomTheme() {
            const savedColors = JSON.parse(localStorage.getItem('customThemeColors'));
            if (savedColors) {
                document.getElementById('color-bg').value = savedColors.bg;
                document.getElementById('color-card').value = savedColors.card;
                document.getElementById('color-text').value = savedColors.text;
                document.getElementById('color-accent').value = savedColors.accent;
                updateCustomTheme();
            } else {
                updateCustomTheme();
            }
        }

        function toggleHeader(forceState) {
            const isCurrentlyPinned = !mainHeader.classList.contains('unpinned');
            const newState = (typeof forceState === 'boolean') ? forceState : !isCurrentlyPinned;

            if (newState) {
                mainHeader.classList.remove('unpinned');
                pinBtn.classList.add('pin-active');
                localStorage.setItem('headerPinned', 'true');
            } else {
                mainHeader.classList.add('unpinned');
                pinBtn.classList.remove('pin-active');
                localStorage.setItem('headerPinned', 'false');
            }
        }

        document.addEventListener('DOMContentLoaded', initQuiz);

    </script>
</body>
</html>
